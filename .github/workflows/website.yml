name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/PRE_RELEASE_MASTERPLAN.md"
      - "docs/USER_GUIDE_DE.md"
      - "docs/USER_GUIDE_EN.md"
      - "docs/PRIVACY_AND_DATA_INVENTORY.md"
      - "docs/DEVICE_QUALIFICATION_PIPELINE.md"
      - "tool/validate_website.mjs"
      - "tool/device_report.mjs"
      - "tool/build_verified_devices.mjs"
      - "tool/test_device_reports.mjs"
      - ".github/workflows/website.yml"
      - ".github/workflows/device-reports.yml"
      - ".github/ISSUE_TEMPLATE/device-report.md"
  pull_request:
    paths:
      - "website/**"
      - "docs/PRE_RELEASE_MASTERPLAN.md"
      - "docs/USER_GUIDE_DE.md"
      - "docs/USER_GUIDE_EN.md"
      - "docs/PRIVACY_AND_DATA_INVENTORY.md"
      - "docs/DEVICE_QUALIFICATION_PIPELINE.md"
      - "tool/validate_website.mjs"
      - "tool/device_report.mjs"
      - "tool/build_verified_devices.mjs"
      - "tool/test_device_reports.mjs"
      - ".github/workflows/website.yml"
      - ".github/workflows/device-reports.yml"
      - ".github/ISSUE_TEMPLATE/device-report.md"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: "irl-dolphin-web-pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate website structure and content
        run: node tool/validate_website.mjs

      - name: Parse website JavaScript
        run: node --check website/app.js

      - name: Test device-report pipeline
        run: node tool/test_device_reports.mjs

  remove-mistaken-public-release:
    name: Remove mistaken public device-test release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-alpha.3-test.231
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --cleanup-tag \
              --yes
          else
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              >/dev/null 2>&1 || true
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Public release still exists."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Public release tag still exists."
            exit 1
          fi

          echo "Removed the mistaken public device-test release and tag." >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build verified-device data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tool/build_verified_devices.mjs

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
